name: support-agent over HTTP (example)
target:
  type: http
  url: http://127.0.0.1:8765/chat
  headers: {Authorization: "Bearer ${AGENT_TOKEN}"}
  request: {session_id: "{{session}}", message: "{{message}}", role: "{{role}}"}
  response:
    text: reply
    outcome: status
    tool_calls: steps
    cost_usd: usage.cost
    trace_id: trace_id
scenarios: ["scenarios.yaml"]
k: 3
thresholds: {nominal: 0.8, escalation: 0.8}
budget_usd: 1.00
concurrency: 6
envelope:
  model: gpt-4.1-mini
  files: ["support_agent.py", "support_agent_checked.py", "http_server.py"]
  extra: {temperature: 0.7}
output: .trustgate/http
